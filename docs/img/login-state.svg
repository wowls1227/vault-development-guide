<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580"
     font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <!-- 로그인 가능 상태 전이도 (/health 의 loginBlocked) — docs/DEVELOPMENT_GUIDE.md 5.6 -->
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <style>
      .t  { fill:#111827; font-size:17px; font-weight:700; }
      .s  { fill:#4b5563; font-size:12.5px; }
      .l  { fill:#374151; font-size:13px; }
      .g  { fill:#047857; font-size:13px; font-weight:600; }
      .m  { font-family:'SF Mono',Menlo,Consolas,monospace; }
      .go { stroke:#374151; stroke-width:1.6; fill:none; marker-end:url(#a-gray); }
      .bk { stroke:#059669; stroke-width:1.8; fill:none; marker-end:url(#a-green); }
    </style>
  </defs>

  <rect width="1100" height="580" fill="#ffffff"/>

  <text x="40" y="44" class="t" style="font-size:16px">로그인 가능 상태</text>
  <text x="40" y="66" class="s"><tspan class="m">/health</tspan> 의 <tspan class="m">loginBlocked</tspan> 값</text>

  <!-- ===== 상태 ===== -->
  <rect x="60" y="190" width="270" height="120" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="195" y="232" text-anchor="middle" class="t">로그인 가능</text>
  <text x="195" y="258" text-anchor="middle" class="s m">loginBlocked = null</text>
  <text x="195" y="282" text-anchor="middle" class="s">필요할 때 secret-id 로 로그인</text>

  <rect x="640" y="40" width="360" height="80" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="820" y="72" text-anchor="middle" class="t m" style="font-size:16px">SECRET_ID_EXPIRED</text>
  <text x="820" y="98" text-anchor="middle" class="s">보관한 secret-id 의 만료 시각이 지남</text>

  <rect x="640" y="210" width="360" height="80" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="820" y="242" text-anchor="middle" class="t m" style="font-size:16px">SECRET_ID_REJECTED</text>
  <text x="820" y="268" text-anchor="middle" class="s">Vault 가 secret-id 를 거부함 → 로그인 중단</text>

  <rect x="640" y="400" width="360" height="90" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="820" y="430" text-anchor="middle" class="t m" style="font-size:16px">LOGIN_LOCKED_OUT</text>
  <text x="820" y="455" text-anchor="middle" class="s">role-id 잠김 의심 → 60초 동안 로그인 중단</text>
  <text x="820" y="475" text-anchor="middle" class="s">이 사이 전달된 secret-id 는 검증 없이 보관</text>

  <!-- ===== 로그인 가능 → 차단 상태 ===== -->
  <path d="M330,205 L638,88" class="go"/>
  <text x="484" y="134" text-anchor="middle" class="l" transform="rotate(-20.8 484 134)">만료 시각 경과</text>

  <path d="M330,250 L638,250" class="go"/>
  <text x="484" y="240" text-anchor="middle" class="l">로그인 400 (secret-id 거부)</text>

  <path d="M330,295 L638,418" class="go"/>
  <text x="474" y="338" text-anchor="middle" class="l" transform="rotate(21.8 474 338)">로그인 403 (잠김 의심)</text>

  <!-- 만료 상태에서 로그인이 필요해지면 거부됨으로 -->
  <path d="M820,120 L820,208" class="go" stroke-dasharray="5 4"/>
  <text x="830" y="160" class="s">만료 상태에서 로그인이</text>
  <text x="830" y="176" class="s">필요해지면 (Vault 호출 안 함)</text>

  <!-- ===== 차단 상태 → 로그인 가능 ===== -->
  <!-- 잠금: 60초 경과 -->
  <path d="M640,470 L300,312" class="bk"/>
  <text x="458" y="412" text-anchor="middle" class="g" transform="rotate(24.9 458 412)">60초 경과</text>

  <!-- 만료 / 거부: 새 secret-id 전달 -->
  <path d="M1000,80 L1050,80 L1050,530 L195,530 L195,312" class="bk"/>
  <path d="M1000,250 L1050,250" stroke="#059669" stroke-width="1.8" fill="none"/>
  <text x="622" y="520" text-anchor="middle" class="g">새 secret-id 전달 → lookup 으로 확인 (토큰이 죽어 있으면 로그인 성공)</text>
</svg>
